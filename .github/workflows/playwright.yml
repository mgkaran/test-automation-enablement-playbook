name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs are useful when investigating an environment problem rather than
  # a code change.
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Only the browsers the suite actually uses, with their system
      # dependencies. Installing every browser would slow every run down for no
      # added coverage.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # The application is built and served by Playwright's webServer, so this
      # step runs the same command a developer runs locally.
      - name: Run Playwright tests
        run: npm test
        env:
          # Credentials come from the repository/environment secret store, never
          # from the repository itself. A secret that is not configured arrives
          # as an empty string rather than as an absent variable, so the suite
          # treats blank as "not configured" and falls back to the demo app's
          # published placeholder values - see playwright/utils/config.ts.
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      # Uploaded on failure as well as success: the report and traces are what
      # make a red build diagnosable without re-running it.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 14
